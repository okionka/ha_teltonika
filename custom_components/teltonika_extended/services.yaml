restore_config:
  name: Restore router configuration (Upload & Validate)
  description: >
    Schritt 1+2: Lädt eine Backup-Datei auf den Router hoch und validiert sie.
    Zeigt eine HA-Benachrichtigung mit den Backup-Metadaten.
    Zum Abschließen: teltonika_extended.restore_config_apply aufrufen.
  fields:
    file_path:
      name: Backup-Datei
      description: >
        Pfad zur Backup-Datei (relativ zu /config oder absolut).
        Beispiel: teltonika_backups/RUTX50_20260527_120000.tar.gz
      required: true
      selector:
        text:
    entry_id:
      name: Integration Entry ID
      description: Optional bei mehreren Teltonika-Routern.
      required: false
      selector:
        text:

restore_config_apply:
  name: Restore router configuration (Apply)
  description: >
    Schritt 3: Wendet das zuvor hochgeladene und validierte Backup an.
    ⚠️ Der Router wird danach neu gestartet.
  fields:
    entry_id:
      name: Integration Entry ID
      description: Optional bei mehreren Teltonika-Routern.
      required: false
      selector:
        text:
