backup_config:
  name: Backup router configuration
  description: >
    Downloads the router configuration and saves it to
    /config/teltonika_backups/<hostname>_<timestamp>.tar.gz
  fields:
    entry_id:
      name: Integration entry ID
      description: Optional. Use when multiple Teltonika routers are configured.
      required: false
      selector:
        text:

restore_config:
  name: Restore router configuration
  description: >
    Uploads a configuration backup file to the router.
    The router will reboot to apply the restored settings.
  fields:
    file_path:
      name: Backup file path
      description: >
        Path to the backup file, e.g.
        teltonika_backups/RUTX50_20250527_120000.tar.gz
        (relative to /config) or an absolute path.
      required: true
      selector:
        text:
    entry_id:
      name: Integration entry ID
      description: Optional. Use when multiple Teltonika routers are configured.
      required: false
      selector:
        text:
